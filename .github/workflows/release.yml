name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME:-dev}"
          mkdir -p dist

          targets='
          windows|amd64|||
          windows|arm64|||
          linux|amd64|||
          linux|arm64|||
          linux|arm|5|v5|
          linux|arm|6|v6|
          linux|arm|7|v7|
          linux|mips|softfloat|-softfloat|
          linux|mipsle|softfloat|-softfloat|
          linux|mips64le|||
          linux|riscv64|||
          darwin|amd64|||
          darwin|arm64|||
          freebsd|amd64|||
          '

          while IFS='|' read -r goos goarch variant suffix _; do
            if [[ -z "${goos}" ]]; then
              continue
            fi

            ext=""
            if [[ "${goos}" == "windows" ]]; then
              ext=".exe"
            fi

            name="anytls-${version}-${goos}-${goarch}${suffix}"
            package_dir="dist/${name}"
            mkdir -p "${package_dir}"

            unset GOARM GOMIPS
            export CGO_ENABLED=0
            export GOOS="${goos}"
            export GOARCH="${goarch}"
            if [[ "${goarch}" == "arm" && -n "${variant}" ]]; then
              export GOARM="${variant}"
            fi
            if [[ "${goarch}" == "mips" || "${goarch}" == "mipsle" ]]; then
              export GOMIPS="${variant}"
            fi

            echo "Building ${name}"
            go build -trimpath -ldflags="-s -w" -o "${package_dir}/anytls-client${ext}" ./cmd/client
            go build -trimpath -ldflags="-s -w" -o "${package_dir}/anytls-server${ext}" ./cmd/server

            cp readme.md "${package_dir}/"
            if [[ "${goos}" == "windows" ]]; then
              (cd dist && zip -qr "${name}.zip" "${name}")
            else
              tar -C dist -czf "dist/${name}.tar.gz" "${name}"
            fi
            rm -rf "${package_dir}"
          done <<< "${targets}"

          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
