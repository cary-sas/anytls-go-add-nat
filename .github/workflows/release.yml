name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME:-dev}"
          mkdir -p dist

          targets='
          windows|amd64|||
          windows|arm64|||
          linux|amd64|||
          linux|arm64|||
          linux|arm|5|v5|
          linux|arm|7|v7|
          darwin|amd64|||
          darwin|arm64|||
          freebsd|amd64|||
          '

          while IFS='|' read -r goos goarch variant suffix _; do
            if [[ -z "${goos}" ]]; then
              continue
            fi

            ext=""
            if [[ "${goos}" == "windows" ]]; then
              ext=".exe"
            fi

            platform="${goos}-${goarch}${suffix}"
            client_name="anytls-client-${version}-${platform}"
            server_name="anytls-server-${version}-${platform}"
            client_dir="dist/${client_name}"
            server_dir="dist/${server_name}"
            mkdir -p "${client_dir}" "${server_dir}"

            unset GOARM GOMIPS
            export CGO_ENABLED=0
            export GOOS="${goos}"
            export GOARCH="${goarch}"
            if [[ "${goarch}" == "arm" && -n "${variant}" ]]; then
              export GOARM="${variant}"
            fi
            echo "Building ${client_name}"
            go build -trimpath -ldflags="-s -w" -o "${client_dir}/anytls-client${ext}" ./cmd/client
            echo "Building ${server_name}"
            go build -trimpath -ldflags="-s -w" -o "${server_dir}/anytls-server${ext}" ./cmd/server

            cp readme.md "${client_dir}/"
            cp readme.md "${server_dir}/"
            if [[ "${goos}" == "windows" ]]; then
              (cd dist && zip -qr "${client_name}.zip" "${client_name}")
              (cd dist && zip -qr "${server_name}.zip" "${server_name}")
            else
              tar -C dist -czf "dist/${client_name}.tar.gz" "${client_name}"
              tar -C dist -czf "dist/${server_name}.tar.gz" "${server_name}"
            fi
            rm -rf "${client_dir}" "${server_dir}"
          done <<< "${targets}"

          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
