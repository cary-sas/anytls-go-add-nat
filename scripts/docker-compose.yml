version: '3.8'

services:
  anytls-router:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: anytls-router
    restart: unless-stopped
    privileged: true
    environment:
      - VPS_IP=${VPS_IP}
      - VPS_PORT=${VPS_PORT:-8443}
      - PASSWORD=${PASSWORD}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "1080:1080/tcp"  # SOCKS5 for explicit proxy
      - "3333:3333/tcp"  # NAT transparent proxy
    volumes:
      - /var/log/anytls:/var/log
    networks:
      - bridge
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1

networks:
  bridge:
    driver: bridge
